name = "redunxt-notifications"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# 5-Minute Cron Trigger (Runs every 5 minutes 24/7)
[triggers]
crons = ["*/5 * * * *"]

# Cloudflare KV Binding (100% Free: 100k reads/day)
# To create the KV namespace run: npx wrangler kv namespace create EDUNEXT_KV
# Then paste the generated id below:
[[kv_namespaces]]
binding = "EDUNEXT_KV"
id = "YOUR_KV_NAMESPACE_ID"
